# E2E 전용 프로필. datasource는 AcceptanceTest의 MySQL 컨테이너가 @ServiceConnection으로
# 주입하므로 여기서 지정하지 않는다.

# 시작 시 동기화를 모두 끈다 — E2E는 테스트가 직접 심은 데이터만 보고 판단해야 하고,
# 빈 DB로 뜨면 이 초기화들이 전부 외부 API를 호출하러 나간다.
rest-stop.sync.startup-enabled=false
flight.airline.sync.startup-enabled=false
flight.airport.sync.startup-enabled=false
flight.city.sync.startup-enabled=false
flight.country.sync.startup-enabled=false

spring.jpa.hibernate.ddl-auto=create-drop

# 위 스위치로 호출 자체를 막았지만, 어떤 경로로도 실제 외부 API에 나가지 않도록 주소를
# 닫아둔다(이중 안전장치). 카카오 두 개는 AcceptanceTest가 WireMock 주소로 덮어쓴다.
ex.api.url=http://localhost:1
ev.api.url=http://localhost:1
opinet.api.url=http://localhost:1
special-day.api.url=http://localhost:1
travelpayouts.api.url=http://localhost:1

ex.api.key=e2e-dummy-key
kakao.rest-api-key=e2e-dummy-key

logging.level.com.restroute=INFO
