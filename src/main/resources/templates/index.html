<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf?.token}">
    <meta name="_csrf_header" th:content="${_csrf?.headerName}">
    <title>rest-route</title>
    <script>
        (function () {
            try {
                var stored = window.localStorage.getItem('rr-theme');
                var theme = stored === 'light' || stored === 'dark'
                    ? stored
                    : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>

<nav class="rr-navbar px-4 py-2">
    <a href="/" class="rr-navbar-brand" aria-label="처음 화면으로">
        <span class="rr-logo-mark" aria-hidden="true">
            <span class="rr-logo-mark-ring"></span>
        </span>
        <span class="rr-navbar-wordmark">rest-route</span>
    </a>
    <button id="themeToggleButton" type="button" class="rr-theme-toggle" aria-label="다크 모드로 전환">
        <span id="themeToggleIcon" class="rr-theme-toggle-icon" aria-hidden="true">🌙</span>
        <span id="themeToggleLabel" class="rr-theme-toggle-label">라이트</span>
    </button>
</nav>

<div class="container-fluid px-4 py-4">
    <section class="rest-stop-map-shell">
        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-2 mb-3">
            <div>
                <h1 class="h4 mb-1">휴게소 위치 지도</h1>
                <p class="rr-text-secondary mb-0">전국 고속도로 휴게소 위치를 지도에서 확인합니다.</p>
            </div>
            <div class="map-action-buttons d-flex align-items-center gap-2">
                <button id="restStopLocateButton" class="btn btn-outline-primary rest-stop-locate-button"
                        type="button">
                    <i class="bi bi-geo-alt-fill me-1"></i>내 위치
                </button>
                <button id="routeSearchButton" class="btn btn-primary route-search-button" type="button">
                    <i class="bi bi-signpost-split me-1"></i>경로 휴게소 찾기
                </button>
                <button id="routeResultOpen" class="btn btn-outline-secondary route-result-open d-none"
                        type="button" aria-haspopup="dialog" aria-controls="routeResultModal">
                    <i class="bi bi-list-ul me-1"></i>경로 결과
                </button>
                <button id="markerModeToggle" class="btn btn-outline-secondary" type="button"
                        aria-pressed="false">
                    전체 휴게소 보기
                </button>
            </div>
        </div>
        <div class="route-point-search mb-2">
            <button id="routePointSummaryToggle" class="route-point-summary" type="button"
                    aria-expanded="false" aria-controls="routePointFields">
                <span class="route-point-summary-kicker">경로</span>
                <span class="route-point-summary-values">
                    <span id="routeOriginSummary" class="route-point-summary-value">출발지 설정</span>
                    <span class="route-point-summary-arrow" aria-hidden="true">→</span>
                    <span id="routeDestinationSummary" class="route-point-summary-value">도착지 입력</span>
                </span>
                <span id="routePointSummaryAction" class="route-point-summary-action">수정</span>
            </button>
            <div id="routePointFields" class="route-point-fields">
                <div class="route-point-row route-origin-row">
                    <span class="route-point-label">출발</span>
                    <output id="routeOriginValue" class="route-point-value">출발지를 설정하세요</output>
                    <button id="routeOriginChangeButton" class="btn btn-sm btn-outline-primary" type="button"
                            aria-haspopup="dialog" aria-controls="routeOriginModal">
                        설정
                    </button>
                </div>
                <div class="route-point-row">
                    <label class="route-point-label" for="routeDestinationInput">도착</label>
                    <input id="routeDestinationInput" type="text" class="form-control"
                           placeholder="목적지를 입력하세요 (예: 부산역)" aria-label="도착지 검색">
                    <button id="routeDestinationSearchButton"
                            class="btn btn-primary route-destination-search-button" type="button">
                        <i class="bi bi-search" aria-hidden="true"></i>검색
                    </button>
                    <button id="routeDestinationMapButton"
                            class="btn btn-outline-secondary route-destination-map-button" type="button">
                        지도 선택
                    </button>
                </div>
            </div>
        </div>
        <div class="rest-stop-map-layout">
            <div class="rest-stop-map-stage">
                <div id="restStopMap" class="rest-stop-map" tabindex="0" aria-label="휴게소 위치 지도"></div>
                <div class="rest-stop-name-search">
                    <div class="rest-stop-name-search-box">
                        <i class="bi bi-search" aria-hidden="true"></i>
                        <input id="restStopNameSearchInput" class="rest-stop-name-search-input" type="text"
                               placeholder="휴게소명 검색" aria-label="휴게소명 검색">
                        <button id="restStopNameSearchButton" class="rest-stop-name-search-submit" type="button"
                                aria-label="휴게소 검색">
                            <i class="bi bi-arrow-right" aria-hidden="true"></i>
                        </button>
                    </div>
                    <p id="restStopNameSearchStatus" class="rest-stop-name-search-status" aria-live="polite" hidden></p>
                </div>
                <div id="routeMapSelectionToolbar" class="route-map-selection-toolbar d-none"
                     role="group" aria-label="지도 위치 선택">
                    <p id="routeMapSelectionMessage" class="route-map-selection-message" aria-live="polite"></p>
                    <div class="route-map-selection-actions">
                        <button id="routeMapSelectionConfirm" class="btn btn-primary" type="button" disabled>
                            이 위치로 선택
                        </button>
                        <button id="routeMapSelectionCancel" class="btn btn-outline-secondary" type="button">
                            취소
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <dialog id="routeResultModal" class="route-result-modal" aria-labelledby="routeResultModalTitle">
            <div id="routeResultModalHandle" class="route-result-modal-handle" aria-hidden="true">
                <span></span>
            </div>
            <div class="route-result-modal-header">
                <h3 id="routeResultModalTitle" class="route-result-modal-title">경로상 휴게소</h3>
                <button id="routeResultModalClose" class="btn-close" type="button"
                        aria-label="경로 결과 닫기"></button>
            </div>
            <div class="route-result-modal-body">
                <div id="routeOptions" class="route-options d-none" role="group" aria-label="경로 선택"></div>
                <p id="routeDirectionAlternativeNotice" class="route-direction-alternative-notice d-none">
                    같은 이름의 상·하행 후보가 함께 표시될 수 있어요. 실제 진행 방향을 확인해주세요.
                </p>
                <section id="routeNationalOilPriceSummary" class="route-national-oil-summary d-none"
                         aria-label="전국 평균 주유 가격"></section>
                <div id="routeRestStopFilters" class="route-rest-stop-filters d-none"
                     role="group" aria-label="경로상 휴게소 필터"></div>
                <ol id="routeResultList" class="route-result-list"></ol>
            </div>
        </dialog>
        <dialog id="routeOriginModal" class="route-point-modal" aria-labelledby="routeOriginModalTitle">
            <div class="route-result-modal-header">
                <h3 id="routeOriginModalTitle" class="route-result-modal-title">출발지 설정</h3>
                <button id="routeOriginModalClose" class="btn-close" type="button"
                        aria-label="출발지 설정 닫기"></button>
            </div>
            <div class="route-point-modal-body">
                <button id="routeOriginCurrentButton" class="btn btn-primary w-100" type="button">
                    <i class="bi bi-crosshair me-1"></i>현재 위치 사용
                </button>
                <div class="route-point-modal-divider"><span>또는</span></div>
                <label class="form-label" for="routeOriginSearchInput">장소 검색</label>
                <div class="input-group">
                    <input id="routeOriginSearchInput" class="form-control" type="text"
                           placeholder="출발지를 입력하세요 (예: 구로역)">
                    <button id="routeOriginSearchButton" class="btn btn-outline-primary" type="button">검색</button>
                </div>
                <button id="routeOriginMapButton" class="btn btn-outline-secondary w-100 mt-3" type="button">
                    <i class="bi bi-geo-alt me-1"></i>지도에서 선택
                </button>
            </div>
        </dialog>
        <dialog id="placeCandidateModal" class="route-result-modal" aria-labelledby="placeCandidateModalTitle">
            <div class="route-result-modal-header">
                <h3 id="placeCandidateModalTitle" class="route-result-modal-title">위치 선택</h3>
                <button id="placeCandidateModalClose" class="btn-close" type="button"
                        aria-label="위치 후보 닫기"></button>
            </div>
            <ol id="placeCandidateList" class="route-result-list"></ol>
        </dialog>
        <dialog id="restStopSearchModal" class="route-result-modal" aria-labelledby="restStopSearchModalTitle">
            <div class="route-result-modal-header">
                <h3 id="restStopSearchModalTitle" class="route-result-modal-title">휴게소 선택</h3>
                <button id="restStopSearchModalClose" class="btn-close" type="button"
                        aria-label="휴게소 검색 결과 닫기"></button>
            </div>
            <ol id="restStopSearchList" class="route-result-list"></ol>
        </dialog>
        <div id="restStopMapError" class="alert alert-warning mt-3 mb-0 d-none" role="alert"></div>
    </section>
</div>

<div id="globalLoadingOverlay" class="global-loading-overlay d-none"
     role="status" aria-live="polite" aria-busy="false">
    <div class="global-loading-card">
        <div class="spinner-border text-primary" aria-hidden="true"></div>
        <p id="globalLoadingMessage" class="global-loading-message mb-0"></p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
