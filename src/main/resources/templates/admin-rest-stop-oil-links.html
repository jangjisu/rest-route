<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴게소 주유소 연결 관리 | rest-route</title>
    <link href="/css/admin_style.css" rel="stylesheet">
</head>
<body>
<div class="app">
    <aside th:replace="~{fragments/admin-shell :: sidebar(active='oil-links')}"></aside>
    <main>
        <header th:replace="~{fragments/admin-shell :: header(title='휴게소 주유소 연결 관리')}"></header>
        <div class="content">
            <div class="workspace">
                <section class="panel rest-stop-oil-link-panel" aria-labelledby="oilLinkHeading">
                    <div class="panel-head">
                        <div>
                            <h2 id="oilLinkHeading">휴게소 주유소 연결 관리</h2>
                            <p>자동 매칭이 놓치거나 잘못 연결한 주유소를 직접 점검하고 연결·해제합니다.</p>
                        </div>
                    </div>
                    <div class="panel-body">
                        <p id="oilLinkStatus" class="helper" aria-live="polite"></p>

                        <div class="oil-link-summary">
                            <div class="oil-link-summary-card">
                                <div class="oil-link-summary-label">전체 휴게소</div>
                                <div id="oilLinkTotalCount" class="oil-link-summary-value">0</div>
                            </div>
                            <div class="oil-link-summary-card oil-link-summary-card--warn">
                                <div class="oil-link-summary-label">연결 없음</div>
                                <div id="oilLinkMissingCount" class="oil-link-summary-value">0</div>
                            </div>
                        </div>

                        <div class="oil-link-filters">
                            <label class="visually-hidden" for="oilLinkSearchInput">휴게소명 검색</label>
                            <input id="oilLinkSearchInput" class="oil-link-input" type="text" placeholder="휴게소명 검색">
                            <button id="oilLinkMissingOnlyButton" class="secondary" type="button" aria-pressed="false">연결없음만</button>
                        </div>

                        <div class="oil-link-table-wrap">
                            <table class="oil-link-table">
                                <thead>
                                <tr>
                                    <th>휴게소</th>
                                    <th>노선</th>
                                    <th>연결된 주유소</th>
                                    <th>상태</th>
                                    <th></th>
                                </tr>
                                </thead>
                                <tbody id="oilLinkTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>
</div>
<div id="oilLinkCsrfSource" hidden th:data-csrf-header="${_csrf.headerName}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
</div>
<dialog id="oilLinkModal" class="food-edit-modal" aria-labelledby="oilLinkModalTitle">
    <div class="food-edit-modal-header">
        <h3 id="oilLinkModalTitle">휴게소</h3>
        <button id="oilLinkModalClose" class="btn-close" type="button" aria-label="닫기">
            <i aria-hidden="true">&times;</i>
        </button>
    </div>
    <h4 class="form-section-title">현재 연결된 주유소</h4>
    <ul id="oilLinkCurrentList" class="oil-link-current-list"></ul>
    <h4 class="form-section-title">주유소 이름으로 검색해서 연결</h4>
    <label class="visually-hidden" for="oilLinkSearchQuery">주유소명 검색</label>
    <input id="oilLinkSearchQuery" class="oil-link-input" type="text" placeholder="예: 마장">
    <ul id="oilLinkSearchResults" class="oil-link-search-results"></ul>
</dialog>
<th:block th:replace="~{fragments/admin-shell :: chrome}"></th:block>
<script type="module" src="/js/admin-rest-oil-link-page.js" defer></script>
</body>
</html>
