plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'pmd'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.9.0'
	id 'com.github.spotbugs' version '6.5.10'
	id 'org.sonarqube' version '7.3.0.8198'
}

group = 'com.restroute'
version = '0.0.1-SNAPSHOT'
description = 'Highway rest stop route planner'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.deprecation = true
	options.compilerArgs << '-Xlint:deprecation'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.3"
	}
}

// spring-dependency-management가 spotbugs 분석 전용 classpath에도 commons-lang3
// 버전을 강제로 낮춰서, BCEL이 요구하는 3.13.0+ 대신 구버전이 물려 spotbugsMain이
// NoClassDefFoundError로 깨진다(https://github.com/spotbugs/spotbugs-gradle-plugin/issues/1197).
ext['commons-lang3.version'] = '3.20.0'

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.github.usefulness:webp-imageio:0.11.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

// E2E는 별도 소스셋으로 분리한다 — src/test의 단위·슬라이스 테스트와 커버리지 집계가
// 섞이면(E2E는 요청 하나로 전 레이어를 훑는다) jacocoTestCoverageVerification의 95%가
// 무엇을 보장하는 숫자인지 알 수 없게 된다. check에는 일부러 붙이지 않는다 — Docker가
// 필요해서 로컬 `./gradlew check`를 무겁게 만든다. 실행은 `./gradlew e2e`.
testing {
	suites {
		e2e(JvmTestSuite) {
			dependencies {
				implementation project()
				// project()는 메인의 jar만 얹고 implementation 의존성은 전파하지 않는다
				// (Gradle의 implementation은 소비자에게 노출되지 않는다). 테스트 코드가 직접
				// 건드리는 JPA 타입(EntityManager, JpaRepository)은 여기 다시 선언해야 한다.
				implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
				implementation 'org.springframework.boot:spring-boot-starter-test'
				implementation 'org.springframework.boot:spring-boot-testcontainers'
				implementation 'org.testcontainers:mysql'
				implementation 'org.testcontainers:junit-jupiter'
				implementation 'io.rest-assured:rest-assured'
				// Spring Boot BOM이 관리하지 않는 유일한 의존성이라 버전을 직접 고정한다.
				// standalone(shaded)을 쓰는 건 WireMock이 끌고 오는 Jetty가 부트의 것과
				// 충돌하지 않게 하기 위해서다.
				implementation 'org.wiremock:wiremock-standalone:3.13.1'
				runtimeOnly 'com.mysql:mysql-connector-j'
			}
			targets.configureEach {
				testTask.configure {
					shouldRunAfter(test)
				}
			}
		}
	}
}

// E2E는 HTTP 응답을 RestAssured의 body() 매처로 검증하고 스텁 JSON을 텍스트 블록으로 쓴다 —
// 단위 테스트를 전제로 만든 이 두 규칙이 전부 오탐을 낸다(assert()가 없다고 보고, 텍스트 블록의
// 개행에 %n을 요구하고, RestAssured.port 대입을 static 필드 쓰기로 잡는다). 스타일 규칙인
// checkstyleE2e는 그대로 둔다 — 그건 실제로 맞춰야 하는 것이고 지금도 통과한다.
tasks.named('pmdE2e') { enabled = false }
tasks.named('spotbugsE2e') { enabled = false }

checkstyle {
	configDirectory = file("$rootDir/config/checkstyle")
}

pmd {
	toolVersion = '7.26.0'
	consoleOutput = true
	ruleSetFiles = files("$rootDir/config/pmd/ruleset.xml")
	ruleSets = []
}

// rules/backend/module-design.md의 "얕은 모듈" 판단 기준 중 기계적으로 검증 가능한
// 부분만 골라 실제 커밋을 막는 별도 게이트로 돌린다. pmdMain(위 ruleSetFiles)은
// SonarCloud를 통한 advisory로만 쓰고, 이 task는 harness code 단계에서 blocking으로 쓴다.
tasks.register('pmdDepthGate', org.gradle.api.plugins.quality.Pmd) {
	description = 'Run PMD module-depth gate (TooManyMethods/TooManyFields/CyclomaticComplexity) for main classes'
	group = 'verification'
	source = sourceSets.main.allJava
	ruleSetFiles = files("$rootDir/config/pmd/ruleset-depth-gate.xml")
	ruleSets = []
	consoleOutput = true
	reports {
		xml.required = true
		html.required = true
	}
}

spotbugs {
	toolVersion = '4.10.3'
	effort = 'max'
	reportLevel = 'medium'
	excludeFilter = file("$rootDir/config/spotbugs/exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html.required = true
		text.required = true
		xml.required = false
	}
}

// 테스트 코드는 PMD/SpotBugs 대상에서 제외한다. 테스트 특유의 관용구(단언문
// 여러 개, 반복되는 리터럴)를 기본 룰셋이 대량으로 오탐 처리해 신호 대비
// 노이즈 비율이 너무 높다(1차 스캔에서 pmdTest만 700건 이상).
tasks.named('pmdTest') { enabled = false }
tasks.named('spotbugsTest') { enabled = false }

jacocoTestReport {
	dependsOn tasks.named('test')

	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn tasks.named('test')

	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.95
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat('2.97.0')
	}
}

sonar {
	properties {
		property 'sonar.organization', 'jangjisu'
		property 'sonar.projectKey', 'rest-route'
		property 'sonar.projectName', 'rest-route'
		property 'sonar.sources', 'src/main/java'
		property 'sonar.tests', 'src/test/java,src/e2e/java'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('jacocoTestReport')
}
