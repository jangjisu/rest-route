plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'checkstyle'
	id 'pmd'
	id 'jacoco'
	id 'com.diffplug.spotless' version '8.6.0'
	id 'com.github.spotbugs' version '6.0.19'
	id 'org.sonarqube' version '7.3.0.8198'
}

group = 'com.restroute'
version = '0.0.1-SNAPSHOT'
description = 'Highway rest stop route planner'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.deprecation = true
	options.compilerArgs << '-Xlint:deprecation'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.apache.commons:commons-csv:1.14.1'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.github.usefulness:webp-imageio:0.11.0'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy tasks.named('jacocoTestReport')
}

checkstyle {
	configDirectory = file("$rootDir/config/checkstyle")
}

pmd {
	toolVersion = '7.7.0'
	consoleOutput = true
	ruleSetFiles = files("$rootDir/config/pmd/ruleset.xml")
	ruleSets = []
}

spotbugs {
	toolVersion = '4.8.6'
	effort = 'max'
	reportLevel = 'medium'
	excludeFilter = file("$rootDir/config/spotbugs/exclude.xml")
}

tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
	reports {
		html.required = true
		text.required = true
		xml.required = false
	}
}

// 테스트 코드는 PMD/SpotBugs 대상에서 제외한다. 테스트 특유의 관용구(단언문
// 여러 개, 반복되는 리터럴)를 기본 룰셋이 대량으로 오탐 처리해 신호 대비
// 노이즈 비율이 너무 높다(1차 스캔에서 pmdTest만 700건 이상).
tasks.named('pmdTest') { enabled = false }
tasks.named('spotbugsTest') { enabled = false }

jacocoTestReport {
	dependsOn tasks.named('test')

	reports {
		xml.required = true
		html.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn tasks.named('test')

	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.95
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('jacocoTestCoverageVerification')
}

spotless {
	java {
		target 'src/**/*.java'
		palantirJavaFormat('2.90.0')
	}
}

sonar {
	properties {
		property 'sonar.organization', 'jangjisu'
		property 'sonar.projectKey', 'rest-route'
		property 'sonar.projectName', 'rest-route'
		property 'sonar.sources', 'src/main/java'
		property 'sonar.tests', 'src/test/java'
		property 'sonar.qualitygate.wait', 'true'
		property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
	}
}

tasks.named('sonar') {
	dependsOn tasks.named('jacocoTestReport')
}
