spring.application.name=rest-route
spring.profiles.active=local

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# data.ex.co.kr API
ex.api.url=https://data.ex.co.kr
# API key: set the real value in application-local.properties (gitignored)
ex.api.key=${EX_API_KEY:YOUR_API_KEY_HERE}

# NAVER Maps JavaScript API key id
naver.maps.ncp-key-id=${NAVER_MAPS_NCP_KEY_ID:}

# Kakao API (route search). Set the real key via KAKAO_REST_API_KEY env var.
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.navi.url=https://apis-navi.kakaomobility.com
kakao.local.url=https://dapi.kakao.com

# Opinet API (national oil average prices). Set the real key via OPINET_API_KEY env var.
opinet.api.url=https://www.opinet.co.kr
opinet.api.key=${OPINET_API_KEY:}

# Environment EV charger API
ev.api.url=https://apis.data.go.kr/B552584/EvCharger
ev.api.key=${EV_API_KEY:}

# 한국천문연구원 특일 정보(공휴일, 대체공휴일 포함). Set the real key via SPECIAL_DAY_API_SERVICE_KEY env var.
special-day.api.url=https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService
special-day.api.service-key=${SPECIAL_DAY_API_SERVICE_KEY:}

# Travelpayouts Data API (Aviasales grouped_prices). Set the real token via TRAVELPAYOUTS_API_TOKEN env var.
travelpayouts.api.url=https://api.travelpayouts.com
travelpayouts.api.token=${TRAVELPAYOUTS_API_TOKEN:}

# Flight reference data seed — 시작 시 테이블이 비어있으면 data/*.sql 번들 파일에서 insert한다
# (라이브 API 호출 없음, set to false to skip startup seeding)
flight.city.sync.startup-enabled=true
flight.country.sync.startup-enabled=true
flight.airline.sync.startup-enabled=true
flight.airport.sync.startup-enabled=true

# H2 Database (file-based: data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/rest-route
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Feign Client global timeout (ms)
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=10000
spring.cloud.openfeign.client.config.default.loggerLevel=FULL
spring.cloud.openfeign.client.config.ex-api.defaultRequestHeaders[User-Agent]=rest-route
spring.cloud.openfeign.client.config.ex-api.defaultRequestHeaders[Accept]=application/json
spring.cloud.openfeign.client.config.ev-charger-api.defaultRequestHeaders[User-Agent]=rest-route
spring.cloud.openfeign.client.config.ev-charger-api.defaultRequestHeaders[Accept]=application/json
spring.cloud.openfeign.client.config.ev-charger-api.readTimeout=60000
spring.cloud.openfeign.client.config.ev-charger-api.loggerLevel=NONE

# Local Feign debug logging
logging.level.com.restroute.client.KakaoNaviFeignClient=DEBUG
logging.level.com.restroute.client.KakaoLocalFeignClient=DEBUG
logging.level.com.restroute.client.OpinetFeignClient=DEBUG
logging.level.com.restroute.client.EvChargerApiClient=DEBUG
logging.level.com.restroute.flight.client.TravelpayoutsFeignClient=DEBUG

# Suppress Chrome DevTools auto-request 404 noise
logging.level.org.springframework.web.servlet.resource.ResourceHttpRequestHandler=ERROR
